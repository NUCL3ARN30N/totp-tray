[package]
description = "Windows tray tool for inspecting and testing TOTP codes"
name = "totp-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
data-encoding = "2.11.1"
dirs = "7.0.0"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
# unstable-winit-030 is a semver-exempt API, so stay on 1.18.x.
slint = { version = "~1.18.1", features = ["raw-window-handle-06", "unstable-winit-030"] }
tray-icon = "0.26.1"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
